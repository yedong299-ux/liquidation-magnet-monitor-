name: Liquidation Magnet Monitor

on:
  schedule:
    # 每10分钟运行一次。GitHub Actions的定时任务不保证精确到分钟，高峰期可能有几分钟延迟。
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # 允许在Actions页面手动点击运行，方便测试

# 避免上一次还没跑完，下一次又触发导致 state.json 写冲突
concurrency:
  group: liquidation-monitor
  cancel-in-progress: false

permissions:
  contents: write  # 需要写权限才能把更新后的 state.json 提交回仓库

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python monitor.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update monitor state [skip ci]"
          git push
